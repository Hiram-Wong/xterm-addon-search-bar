name: Release

on:
  push:
    tags:
      - v*.*.*

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release info
        id: get-info
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> $GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Dependencies
        run: yarn

      - name: Build Project
        run: yarn build

      - name: Pack Lib
        run: |
          tar -czf "xterm-addon-search-bar-v${{ steps.get-info.outputs.version }}.tar.gz" lib

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          makeLatest: false
          tag: ${{ steps.get-info.outputs.version }}
          artifacts: '*.tar.gz'
          token: ${{ secrets.GITHUB_TOKEN }}
